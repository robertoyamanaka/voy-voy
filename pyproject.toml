[project]
name = "voyvoy"
version = "0.1.0"
description = "Let Claude Code call people: a fast voice agent talks on Google Meet while your Claude Code session answers and steers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Roberto Yamanaka" }]
keywords = ["claude-code", "voice-agent", "livekit", "google-meet", "mcp", "talker-reasoner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "aiohttp>=3.9",
  "livekit-agents>=1.8.12,<2",
  "livekit>=1.2.1",
  "livekit-api>=1.2.3",
  "livekit-plugins-silero>=1.8.12",
  "mcp>=2.3,<3",
  "sounddevice>=0.5",
  "numpy",
]

[project.urls]
Homepage = "https://voyvoy.sh"
Repository = "https://github.com/robertoyamanaka/voy-voy"

[project.scripts]
voy = "voyvoy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voyvoy"]
exclude = ["src/voyvoy/native/voy-tap/.build"]

[tool.hatch.build.targets.sdist]
exclude = ["src/voyvoy/native/voy-tap/.build", ".superpowers", "site", ".claude-plugin", "plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
